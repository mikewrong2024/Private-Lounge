<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lounge · realtime private room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #f3f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .lounge-app {
      max-width: 1220px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* header */
    .lounge-header {
      padding: 1.6rem 2rem 1.3rem 2rem;
      background: #ffffff;
      border-bottom: 1px solid #eef1f6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }

    .lounge-header h1 {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lounge-header h1::before {
      content: "📬";
      font-size: 1.8rem;
      background: none;
      -webkit-text-fill-color: initial;
      background-clip: unset;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .badge {
      background: #eef1f6;
      color: #1f2937;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.42rem 0.9rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge.live {
      background: #dcfce7;
      color: #166534;
    }

    .badge.demo {
      background: #fef3c7;
      color: #92400e;
    }

    .header-btn {
      border: none;
      background: #4f46e5;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.48rem 0.95rem;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
